name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建的标签（如 v1.00）"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            label: macOS (Universal)
          - platform: ubuntu-22.04
            args: ""
            label: Linux
          - platform: windows-latest
            args: ""
            label: Windows

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check and build frontend
        run: npm run build

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "PVE Desktop ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: |
            跨平台 PVE 云桌面客户端。SPICE 优先、noVNC 兜底。

            - **Windows**：下载 `.msi` 或 `.exe`（NSIS 安装包）
            - **macOS**：下载 `.dmg`（未签名，首次打开需右键 → 打开）
            - **Linux**：下载 `.AppImage` 或 `.deb`

            macOS 若提示「已损坏」，执行：

            ```bash
            xattr -dr com.apple.quarantine /Applications/PVE\ Desktop.app
            ```
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
